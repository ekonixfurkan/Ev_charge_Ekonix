<style>
:root{

  --nav:#1d3342;--nav-ink:#ffffff;--nav-muted:#b9c8d2;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --p-owner:#5b9be6;--p-ent:#5fb3cc;--p-star:#b392e6;--p-eko:#a3d65c;--p-fon:#94a3b8;
    --nav:#14232d;--nav-ink:#eef3f6;--nav-muted:#8fa3b0;
    --ink:#e3eaee;--muted:#93a4ae;--line:#2c3d48;--bg:#0f1a21;--surface:#16242d;--soft:#1b2b35;
    --accent:#5b9be6;--accent-soft:#0f2a4d;
    --dc:#5fb3cc;--ac:#a7c76a;
    --ok:#5cc187;--ok-soft:#173326;--risk:#e8b04a;--risk-soft:#3a2d12;--no:#ec7a6c;--no-soft:#3a1b18;
    --s-aday:#7d8e98;--s-inceleme:#5b9be6;--s-sunuldu:#5fb3cc;--s-onay:#8fd14f;--s-red:#ec7a6c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --p-owner:#5b9be6;--p-ent:#5fb3cc;--p-star:#b392e6;--p-eko:#a3d65c;--p-fon:#94a3b8;
    --nav:#14232d;--nav-ink:#eef3f6;--nav-muted:#8fa3b0;
    --ink:#e3eaee;--muted:#93a4ae;--line:#2c3d48;--bg:#0f1a21;--surface:#16242d;--soft:#1b2b35;
    --accent:#5b9be6;--accent-soft:#0f2a4d;
    --dc:#5fb3cc;--ac:#a7c76a;
    --ok:#5cc187;--ok-soft:#173326;--risk:#e8b04a;--risk-soft:#3a2d12;--no:#ec7a6c;--no-soft:#3a1b18;
    --s-aday:#7d8e98;--s-inceleme:#5b9be6;--s-sunuldu:#5fb3cc;--s-onay:#8fd14f;--s-red:#ec7a6c;
    color-scheme:dark;
  }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Aptos",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;padding:8px 13px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--no);border-color:transparent}
:focus-visible{outline:3px solid var(--dc);outline-offset:2px}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);min-width:0}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
label > input,label > select,label > textarea{margin-top:4px;font-weight:400}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:6px 0}

header{background:var(--nav);color:var(--nav-ink);padding:18px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
header h1{font-size:22px;font-weight:600}
header p{color:var(--nav-muted);font-size:13px;margin:2px 0 0}
#saveStatus{font-size:12px;color:var(--nav-muted)}
#saveStatus.err{color:#ffc27a}

/* Pipeline strip: the one bold element */
.pipeline{background:var(--nav);padding:0 26px 20px;color:var(--nav-ink)}
.pipe{display:flex;height:42px;border-radius:6px;overflow:hidden;background:#ffffff14}
.pipe button{border:0;border-radius:0;padding:0 12px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;min-width:0;transition:flex-grow .35s ease}
.pipe button b{font-size:18px}
.pipe button[aria-pressed=true]{box-shadow:inset 0 -4px 0 #fff}
.pipe .empty{color:var(--nav-muted);padding:0 12px;display:flex;align-items:center;font-size:13px}
.pipe-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--nav-muted)}
.pipe-legend strong{color:var(--nav-ink);font-weight:600}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 170px)}
aside{background:var(--surface);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.aside-top{display:flex;gap:8px}
.aside-top input{flex:1}
.filter-note{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.filter-note button{padding:2px 8px;font-size:12px}
.aside-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.aside-foot button{font-size:13px;padding:6px 10px}
.aside-foot p{font-size:11.5px;color:var(--muted);margin:4px 0 0;line-height:1.5}

main{padding:22px 26px;max-width:1300px;width:100%}
.viewbar{display:flex;gap:6px;margin-bottom:16px}
.viewbar button[aria-pressed=true]{background:var(--nav);color:var(--nav-ink);border-color:var(--nav)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.box h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box h3 small{font-weight:400;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}

.site-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.site-head h2{font-size:24px;font-weight:600}
.site-head p{color:var(--muted);font-size:13px}
.verdict{display:flex;gap:10px;align-items:stretch}
.vcell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:120px}
.vcell span{display:block;font-size:12px;color:var(--muted)}
.vcell strong{font-size:22px;font-variant-numeric:tabular-nums}
.vcell select{margin-top:2px;font-weight:600}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}

/* Units */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
td.num,th.num{text-align:right}
tfoot td{font-weight:600;border-bottom:0}
.units td input,.units td select{padding:6px 7px}
.units td.w-kind{width:92px}.units td.w-n{width:90px}
.kind-dc{border-left:4px solid var(--dc)}.kind-ac{border-left:4px solid var(--ac)}
.scroll{overflow-x:auto}
.unit-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.capacity{margin-top:14px}
.capbar{height:14px;border-radius:7px;background:var(--soft);border:1px solid var(--line);overflow:hidden;display:flex}
.capbar i{display:block;height:100%}
.capnote{font-size:12.5px;color:var(--muted);margin-top:6px}
.capnote.bad{color:var(--no);font-weight:600}

/* Due diligence */
.dd-row{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dd-row:last-child{border-bottom:0}
.dd-row .q{font-size:14px}
.dd-row .q small{display:block;color:var(--muted);font-size:12px}
.dd-row .q .crit{color:var(--no);font-size:11.5px;font-weight:600;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:12.5px;background:var(--surface);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true][data-v=ok]{background:var(--ok-soft);color:var(--ok);font-weight:600}
.seg button[aria-pressed=true][data-v=risk]{background:var(--risk-soft);color:var(--risk);font-weight:600}
.seg button[aria-pressed=true][data-v=no]{background:var(--no-soft);color:var(--no);font-weight:600}
.dd-row input{font-size:13px}
.alert{padding:10px 14px;border-left:4px solid var(--no);background:var(--no-soft);font-size:13px;margin-bottom:12px;border-radius:0 6px 6px 0}
.alert.warn{border-color:var(--risk);background:var(--risk-soft)}

/* Portfolio */
.totals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.total{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.total span{display:block;font-size:12px;color:var(--muted)}
.total strong{font-size:22px;font-variant-numeric:tabular-nums}
.portfolio tbody tr{cursor:pointer}
.portfolio tbody tr:hover{background:var(--soft)}
.score{font-weight:600}
.score.lo{color:var(--no)}.score.mid{color:var(--risk)}.score.hi{color:var(--ok)}
.emptystate{text-align:center;padding:50px 20px;color:var(--muted)}
.emptystate h2{color:var(--ink);font-size:20px;margin-bottom:8px}

#toast{position:fixed;bottom:18px;right:18px;background:var(--nav);color:var(--nav-ink);padding:11px 16px;border-radius:7px;z-index:20;max-width:85vw}
dialog{border:1px solid var(--line);border-radius:10px;padding:22px;width:min(440px,92vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0d1a2366}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
dialog label{margin-top:10px}

/* Survey & AMG scoring */
.leadcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.newlead{display:flex;gap:6px}.newlead input{flex:1;min-width:0}.newlead button{padding:6px 10px}
fieldset.chks{border:1px solid var(--line);border-radius:6px;padding:8px 10px 10px;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;min-width:0}
fieldset.chks.span2{grid-column:span 2}fieldset.chks.span4{grid-column:1/-1}
fieldset.chks legend{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
fieldset.chks label{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);font-size:13.5px}
fieldset.chks input{width:auto;margin:0}
.scoretotal{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.scoretotal strong{font-size:30px;font-variant-numeric:tabular-nums}
.scoretotal span{color:var(--muted);font-size:14px}
.guide{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px}
.amg-row{display:grid;grid-template-columns:minmax(0,1.4fr) 170px minmax(0,1fr);gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.amg-row .q{font-size:14px;font-weight:600}
.amg-row .q small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.amg-row .q small.en{font-style:italic}
.pts{display:grid;grid-template-columns:64px auto;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.pts input{padding:6px 7px;font-weight:600}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media (max-width:700px){.amg-row{grid-template-columns:1fr}fieldset.chks.span2{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
/* Revenue model */
.subh{font-size:14px;margin:20px 0 6px}
.units td input:disabled,.units td select:disabled{opacity:.35}
.tranches td select{min-width:140px}.tranches td input[data-tf=term],.tranches td input[data-tf=rate]{min-width:64px}.tranches td input[data-tf=item]{min-width:170px}.tranches td input[data-tf=amount]{min-width:120px}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.grid.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.subgrid{margin-top:14px}
.shareinfo{font-size:13px;font-weight:600;margin-top:8px}
.shareinfo.bad{color:var(--no)}
.inline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.inline label{display:flex;align-items:center;gap:5px;font-weight:400;color:var(--ink)}
.inline input{width:auto;margin:0}
.box details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.box summary{cursor:pointer;font-weight:600;font-size:14px}
.note{font-size:12.5px;color:var(--muted);max-width:80ch}
input[aria-invalid=true]{border:2px solid var(--no)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--soft)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin:6px 0 10px}
.chart text{font-size:12px;fill:var(--muted);font-family:inherit}
.yearly td,.yearly th{white-space:nowrap;font-size:12.5px}
.yearly td{text-align:right}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.totals{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{grid-template-columns:240px minmax(0,1fr)}}
@media (max-width:700px){
  header,.pipeline{padding-left:14px;padding-right:14px}
  .shell{display:block}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .aside-foot p{display:none}
  main{padding:14px}
  .totals{grid-template-columns:1fr 1fr}
  .dd-row{grid-template-columns:1fr}
  .verdict{width:100%}.vcell{flex:1;min-width:0}
  .pipe button span{display:none}
}
@media (prefers-reduced-motion:reduce){.pipe button{transition:none}}
@media print{
  header,.pipeline{background:none;color:#000}
  aside,.viewbar,.unit-actions,#toast,.no-print,button.ghost{display:none!important}
  body{display:block}.shell{display:block}main{max-width:none;padding:0}
  .box{break-inside:avoid}
}
/* ===== Modern tema: slate + amber, Aptos, kart mimarisi ===== */
:root{
  --ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--surface:#ffffff;--soft:#f1f5f9;
  --accent:#0f4c9c;--accent-soft:#eaf2fb;--nav:#0f172a;--brand-blue:#0f4c9c;--brand-blue-dark:#0c3e80;--brand-green:#7cb52b;
  --radius:12px;--shadow:0 1px 2px rgba(15,23,42,.05);
  --font:"Aptos",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--bg:#0b1220;--surface:#111a2b;--soft:#172033;--accent:#5b9be6;--accent-soft:#0f2a4d;--nav:#0b1220;--shadow:0 1px 2px rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{--ink:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--bg:#0b1220;--surface:#111a2b;--soft:#172033;--accent:#5b9be6;--accent-soft:#0f2a4d;--nav:#0b1220;--shadow:0 1px 2px rgba(0,0,0,.4);}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{border-radius:8px;font-weight:500;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover{border-color:var(--muted);background:var(--soft)}
button.primary{background:#0f4c9c;border-color:#0f4c9c;color:#fff;font-weight:500;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.primary:hover{background:#0c3e80;border-color:#0c3e80}
button.ghost:hover{background:var(--soft);color:var(--ink)}
input,select,textarea{border-radius:8px;border-color:var(--line);min-height:40px;font-size:14px}
textarea{min-height:64px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#0f4c9c;box-shadow:0 0 0 3px rgba(15,76,156,.2)}
:focus-visible{outline:2px solid #0f4c9c;outline-offset:2px}
.units td input,.units td select{min-height:34px}

/* Başlık */
header{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding:20px 28px;align-items:center}
header h1{font-size:24px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
header p{color:var(--muted);font-size:14px;line-height:1.5;margin:4px 0 0;max-width:62ch}
#saveStatus{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.4;box-shadow:0 1px 2px rgba(15,23,42,.05);color:#4d7a12;background:rgba(124,181,43,.12);border:1px solid rgba(124,181,43,.35)}
#saveStatus::before{content:"";width:8px;height:8px;border-radius:50%;background:#7cb52b;flex:none}
#saveStatus.err{color:#b03a2e;background:rgba(176,58,46,.08);border-color:rgba(176,58,46,.3)}
#saveStatus.err::before{background:#b03a2e;animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #saveStatus{color:#a3d65c}:root:not([data-theme="light"]) #saveStatus.err{color:#f0897d}}
:root[data-theme="dark"] #saveStatus{color:#a3d65c}:root[data-theme="dark"] #saveStatus.err{color:#f0897d}
@media (prefers-reduced-motion:reduce){#saveStatus.err::before{animation:none}}

/* KPI kartları + durum çubuğu */
.pipeline{background:var(--bg);color:var(--ink);padding:20px 28px 4px;display:flex;flex-direction:column}
.pipe-legend{order:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin:0 0 16px;color:var(--ink)}
.pipe{order:2;height:44px;border-radius:var(--radius);background:var(--soft);border:1px solid var(--line)}
.pipe button{font-weight:500}
.pipe button[aria-pressed=true]{box-shadow:inset 0 -4px 0 rgba(255,255,255,.85)}
.pipe .empty{color:var(--muted)}
.mk{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.mk span{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mk strong{display:block;margin-top:4px;font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mk strong small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:0}

/* Sol panel: koyu navigasyon */
@media (min-width:701px){
  body{display:grid;grid-template-columns:256px minmax(0,1fr);grid-template-rows:auto auto 1fr;min-height:100vh}
  .shell{display:contents}
  aside{grid-column:1;grid-row:1/span 3}
  body>header,.pipeline,main{grid-column:2}
  main{max-width:none}

const DECISIONS=[{min:80,t:'İlerlet',en:'Advance',cls:'hi'},{min:60,t:'Eksikleri Gider',en:'Resolve gaps',cls:'mid'},{min:0,t:'Öncelik Dışı',en:'Deprioritize',cls:'lo'}];
const VAL={ok:{t:'Uygun',s:1},risk:{t:'Riskli',s:.5},no:{t:'Uygun Değil',s:0}};

const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Türkçe Başlık Düzeni: her kelimenin ilk harfi büyük; DC, EKONİX gibi tamamı büyük kelimeler ve kW korunur.
const TITLE_SMALL=new Set(['ve','ile','için']),TITLE_KEEP=new Set(['kW','kVA','kWh']);
const toTurkishTitleCase=str=>String(str).split(' ').map((w,i)=>{
  if(!w||TITLE_KEEP.has(w)||w===w.toLocaleUpperCase('tr-TR'))return w;
  if(i&&TITLE_SMALL.has(w.toLocaleLowerCase('tr-TR')))return w.toLocaleLowerCase('tr-TR');
  return w.charAt(0).toLocaleUpperCase('tr-TR')+w.slice(1);
}).join(' ');
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const statusOf=k=>STATUSES.find(s=>s.k===k)||STATUSES[0];

/* ---------- revenue & financing model ---------- */
const YEARS=7;
const FIN_DEFAULT={initial:15,growth:2,sale:14.49,cost:5.454,saleGrowth:0,costGrowth:0,share:20,entShare:0,starShare:0,ekoShare:0,fundShare:0,fundName:'',commission:0,opex:0,opexGrowth:0};
const FIN_LIMITS={initial:[0,100],growth:[-20,20],sale:[0,1000],cost:[0,1000],saleGrowth:[-100,200],costGrowth:[-100,200],share:[0,100],entShare:[0,100],starShare:[0,100],ekoShare:[0,100],fundShare:[0,100],commission:[0,100],opex:[0,1e10],opexGrowth:[0,200]};
const PARTIES=[
  {k:'owner',t:'Yer Sağlayıcı',sh:'Yer Sağlayıcı',c:'var(--p-owner)',share:'share'},
  {k:'ent',t:'Co-CPO (Entegre)',sh:'Co-CPO',c:'var(--p-ent)',share:'entShare'},
  {k:'star',t:'StarCharge (AMG)',sh:'StarCharge',c:'var(--p-star)',share:'starShare'},
  {k:'eko',t:'EKONİX',sh:'EKONİX',c:'var(--p-eko)',share:'ekoShare'},
  {k:'fon',t:'Diğer Fon',sh:'Diğer Fon',c:'var(--p-fon)',share:'fundShare'}
];
[STATUSES,DECISIONS].forEach(a=>a.forEach(x=>{x.t=toTurkishTitleCase(x.t);}));Object.values(VAL).forEach(x=>{x.t=toTurkishTitleCase(x.t);});PARTIES.forEach(x=>{x.t=toTurkishTitleCase(x.t);x.sh=toTurkishTitleCase(x.sh);});
const ITEMS=['Donanım','Saha işleri (EPC)','Şebeke bağlantısı','Diğer'];
const party=k=>PARTIES.find(p=>p.k===k)||PARTIES[0];
const pName=(k,s)=>k==='fon'&&s&&s.fin.fundName?s.fin.fundName:party(k).t;
const pShort=(k,s)=>k==='fon'&&s&&s.fin.fundName?s.fin.fundName:party(k).sh;
const money=v=>nf.format(v)+' TL';
const df=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:1});
const df2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=v=>v==null?'—':v>=99?'>99':df2.format(v);
const dscrClass=v=>v==null?'':v<1?'lo':v<1.2?'mid':'hi';
const shareTotal=v=>v.share+v.entShare+v.starShare+v.ekoShare+(v.fundShare||0);
function tranche(item,fin='star',mode='share'){return {id:uid(),item,amount:0,fin,mode,term:5,rate:0,payer:'ent'};}
const defaultTranches=()=>[tranche('Donanım'),tranche('Saha işleri (EPC)')];
const totalFin=s=>(s.tranches||[]).reduce((a,t)=>a+(+t.amount||0),0);
const annuity=t=>{const a=+t.amount||0,n=Math.max(1,Math.round(+t.term||1)),r=(+t.rate||0)/100;return t.mode!=='loan'||!a?0:r?a*r/(1-(1+r)**-n):a/n;};

function calculate(s){
  const v=s.fin,kw=totals(s).kw;
  return Array.from({length:YEARS},(_,i)=>{
    const u=Math.min(100,Math.max(0,v.initial+i*v.growth)),energy=kw*8760*u/100,
      sale=v.sale*(1+v.saleGrowth/100)**i,cost=v.cost*(1+v.costGrowth/100)**i,
      revenue=energy*sale,margin=energy*(sale-cost),p=x=>margin*(x||0)/100,
      owner=p(v.share),ent=p(v.entShare),star=p(v.starShare),eko=p(v.ekoShare),fon=p(v.fundShare),
      fee=revenue*v.commission/100,opex=v.opex*(1+v.opexGrowth/100)**i;
    return {year:i+1,u,energy,revenue,margin,owner,ent,star,eko,fon,fee,opex,entCash:ent-fee-opex,remaining:margin*(100-shareTotal(v))/100};
  });
}
const SUMKEYS=['energy','revenue','margin','owner','ent','star','eko','fon','fee','opex','entCash','remaining'];
function aggregate(sites){
  const all=sites.map(calculate);
  return Array.from({length:YEARS},(_,i)=>{const r={year:i+1,u:all.length?all.reduce((t,a)=>t+a[i].u,0)/all.length:0};for(const k of SUMKEYS)r[k]=all.reduce((t,a)=>t+a[i][k],0);return r;});
}
function minDscr(pre,ds){let m=null;ds.forEach((d,i)=>{if(d>0.5){const v=pre[i]/d;m=m==null?v:Math.min(m,v);}});return m;}
function finance(s,rows=calculate(s)){
  const P={};
  for(const p of PARTIES)P[p.k]={invest:0,pre:rows.map(r=>p.k==='ent'?r.entCash:r[p.k]),ds:Array(YEARS).fill(0),recv:Array(YEARS).fill(0)};
  const loans=[];
  for(const t of s.tranches||[]){
    const a=+t.amount||0;if(a<=0)continue;P[t.fin].invest+=a;
    if(t.mode==='loan'){
      const n=Math.max(1,Math.round(+t.term||1)),r=(+t.rate||0)/100,pay=annuity(t);let bal=a;const sched=[];
      for(let i=0;i<YEARS;i++){let p=0;if(i<n){p=pay;bal=Math.max(0,bal*(1+r)-pay);if(bal<1)bal=0;}sched.push(p);P[t.payer].ds[i]+=p;P[t.fin].recv[i]+=p;}
      loans.push({t,site:s,pay,sched,balance:bal,n});
    }
  }
  for(const k in P){const x=P[k];x.flows=[-x.invest,...x.pre.map((v,i)=>v-x.ds[i]+x.recv[i])];x.dscr=minDscr(x.pre,x.ds);}
  loans.forEach(l=>l.dscr=P[l.t.payer].dscr);
  return {P,loans,ds:Array.from({length:YEARS},(_,i)=>loans.reduce((a,l)=>a+l.sched[i],0))};
}
function aggFinance(sites){

  if(dirty){touched(s);flush();}else status('Sunucuda kayıtlı · '+clock());
  renderSite();toast('Lokasyon bilgileri güncellendi.');
}
function cancelEdit(quiet){
  const s=cur();if(!siteEdit)return;
  const snap=editSnap,dirty=editDirty;exitEdit();
  if(s&&snap&&dirty){const k=db.sites.findIndex(x=>x.id===s.id);if(k>=0)db.sites[k]=snap;}
  status(pending.size?'Kaydediliyor…':'Sunucuda kayıtlı · '+clock());
  if(!quiet){renderSite();toast(dirty?'Değişiklikler geri alındı.':'Düzenleme iptal edildi.');}
}
// Kaydedilmemiş değişiklik varken başka sayfaya geçişi onaya bağlar.
function guard(fn){
  if(!siteEdit||!editDirty){if(siteEdit)exitEdit();fn();return;}
  ask('Kaydedilmemiş değişiklikler var. Vazgeçip çıkılsın mı?','Değişiklikleri At').then(ok=>{if(!ok)return;cancelEdit(true);fn();});
}

  const b=e.target.closest('#editStart,#editSave,#editCancel');if(!b)return;
  if(b.id==='editStart')startEdit();else if(b.id==='editSave')saveEdit();else cancelEdit();
});

function updateDerived(){
  const s=cur();if(!s)return;const t=totals(s),d=amgScore(s),sc=scoreOf(s);
  $('vScore').textContent=sc.label;$('vScore').className='score '+sc.cls;$('vDec').textContent=sc.text;$('vDec').className='score '+sc.cls;
  $('vStage').textContent=stageLabel(s.stage);$('vStatus').textContent=statusOf(s.status).t;
  $('amgTotal').textContent=d.done?d.label:'Puanlanmadı';$('amgTotal').className='score '+d.cls;
  $('amgDec').textContent=d.complete?'Karar: '+d.dec.t+' ('+d.dec.en+')':d.done?`${AMG.length-d.done} kriter daha puanlanınca karar gösterilir`:'Her kriteri 0 ile ağırlığı arasında puanlayın';
  AMG.forEach(c=>{const m=document.querySelector(`[data-meter="${c.k}"]`),raw=s.amg.scores[c.k],v=+raw;if(m)m.style.width=(raw!==''&&raw!=null&&Number.isFinite(v)?v/c.w*100:0)+'%';});
  const attDone=ATTACH.filter(a=>s.att[a.k]).length;$('attProgress').textContent=`${attDone}/${ATTACH.length} ek işaretlendi`;
  $('evPotential').textContent=t.kw?`Şarj potansiyeli ünite tablosundan alınır: ${s.units.map(u=>`${u.kind} ${nf.format(u.kw)} kW × ${u.qty}`).join(', ')}.`:'Şarj potansiyeli ünite tablosundan alınır.';
  $('vKw').textContent=nf.format(t.kw)+' kW';
  $('unitSummary').textContent=`${t.dcUnits} DC (${t.dcSock} soket) · ${t.acUnits} AC (${t.acSock} soket)`;
  $('unitFoot').innerHTML=s.units.length?`<tr><td colspan="5">DC ${nf.format(t.dcKw)} kW + AC ${nf.format(t.acKw)} kW</td><td class="num">${nf.format(t.kw)}</td><td></td></tr>`:'';
  const cr=capRef(s),g=cr?cr.v:0,bar=$('capbar'),note=$('capnote');
  if(g>0){const scale=Math.max(g,t.kw);
    bar.innerHTML=`<i style="width:${t.dcKw/scale*100}%;background:var(--dc)"></i><i style="width:${t.acKw/scale*100}%;background:var(--ac)"></i>`;
    const pct=Math.round(t.kw/g*100);
    note.textContent=t.kw>g?`Kurulu güç ${nf.format(t.kw)} kW, ${nf.format(g)} ${cr.u}: %${pct}. Ek bağlantı, yük yönetimi veya daha az ünite gerekir.`:`Kurulu güç, ${nf.format(g)} ${cr.u} gücün %${pct}'ini kullanıyor (güç faktörü 1 varsayımıyla kaba kontrol).`;
    note.className='capnote'+(t.kw>g?' bad':'');
  }else{bar.innerHTML=`<i style="width:${t.kw?t.dcKw/t.kw*100:0}%;background:var(--dc)"></i><i style="width:${t.kw?t.acKw/t.kw*100:0}%;background:var(--ac)"></i>`;note.textContent='Saha keşfinde trafo veya kullanılabilir güç girilmedi; kapasite kontrolü yapılamıyor.';note.className='capnote';}
  $('ddProgress').textContent=`${d.done}/${AMG.length} kriter puanlandı`;
  let a='';
  if(d.blockers.length)a+=`<div class="alert">Engel: ${esc(d.blockers.join(', '))} uygun değil.</div>`;
  if(sc.v!=null&&sc.v<75&&isOpen(s))a+=`<div class="alert warn">Skor ${sc.label}; 75 altı. Sahayla devam edilip edilmeyeceği değerlendirilmeli.</div>`;
  if(s.blocker&&isOpen(s))a+=`<div class="alert warn">Engel: ${esc(s.blocker)}</div>`;
  const todo=[];
  if(!s.units.length)todo.push('Şarj Üniteleri');
  if(!(+s.gridKva)&&!(+s.survey.availKw))todo.push('Altyapı & Güç');
  if(!totalFin(s))todo.push('Finansman');
  if(!d.done&&!Object.values(s.dd||{}).some(x=>x&&(x.v||x.note)))todo.push('Kontrol Listesi');

const isoDate=v=>{if(v==null||v==='')return '';
  if(v instanceof Date)return isNaN(v)?'':new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())).toISOString().slice(0,10);
  const m=String(v).trim().match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10);};
const numOrBlank=v=>{if(v===''||v==null)return '';const n=+String(v).replace(',','.');return Number.isFinite(n)?n:'';};
function convertIn(key,v){
  if(v==null)return '';
  if(key==='score'||key==='manHours'||key==='evseKw')return numOrBlank(v);
  if(key==='nextActionDate'||key==='approvalDate')return isoDate(v);
  if(key==='updatedAt'){const d=isoDate(v);return d?d+'T12:00:00.000Z':'';}
  if(key==='stage'){const m=String(v).trim().match(/^(\d{1,2})/);const k=m?m[1].padStart(2,'0'):'';return STAGES.some(x=>x[0]===k)?k:'';}
  if(key==='status')return STATUS_IN[String(v).trim().toLowerCase()]??'active';
  if(key==='type'){const t=String(v).trim();const hit=TYPES.find(x=>x[0].toLowerCase()===t.toLowerCase()||x[1].toLowerCase()===t.toLowerCase());return hit?hit[0]:(t?'Other':'');}
  return String(v).replace(/\s+$/,'').replace(/^\s+/,'');
}
// Çalışma kitabını okuyup { rows: Map(norm ad -> alanlar), warns, sheets } döndürür.
function parseWorkbook(XL,buf){
  const wb=XL.read(buf,{type:'array',cellDates:true});
  const rows=new Map(),warns=[],used=[];let skipped=0;
  for(const name of wb.SheetNames){
    const aoa=XL.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
    const hi=aoa.findIndex(r=>r&&r.some(c=>String(c??'').trim().toLowerCase()==='project name'));
    if(hi<0)continue;
    const cols=[];aoa[hi].forEach((h,i)=>{const key=IMPORT_MAP[String(h??'').trim().toLowerCase()];if(key)cols.push([i,key]);});
    // Kullanım Rehberi, Contracts gibi sayfalar da “Project Name” içerir; en az 5 tanınan sütun yoksa saha tablosu sayılmaz.
    if(!cols.some(c=>c[1]==='name')||cols.length<5)continue;
    used.push(name);
    for(const r of aoa.slice(hi+1)){
      const o={};let any=false;
      for(const [i,key] of cols){const v=convertIn(key,r[i]);o[key]=v;if(key!=='name'&&v!=='')any=true;}
      const nm=(o.name||'').trim();if(!nm){continue;}
      if(/\(example\)/i.test(nm)){skipped++;continue;}
      const nk=norm(nm),cur=rows.get(nk);
      if(!cur)rows.set(nk,{...o,name:nm,_sheet:name});
      else{
        if(cur._sheet===name){warns.push('Mükerrer satır atlandı: '+nm);continue;}
        for(const [k,v] of Object.entries(o))if(v!==''&&(cur[k]===''||cur[k]==null))cur[k]=v;
      }
    }
  }
  return {rows,warns,used,skipped};
}
function planImport(parsed){
  const byName=new Map(db.sites.map(s=>[norm(s.name),s]));
  let add=0,upd=0;const items=[];
  for(const [nk,o] of parsed.rows){const ex=byName.get(nk);items.push({o,ex});ex?upd++:add++;}
  return {items,add,upd};
}
function applyFields(site,o){
  for(const [k,v] of Object.entries(o)){
    if(k==='_sheet'||k==='name'||v===''||v==null)continue;
    if(k==='updatedAt')continue;
    setPath(site,k,v);
  }
}
async function runImport(plan,parsed){
  const base=Date.now();let i=0;
  for(const {o,ex} of plan.items){
    let site=ex;
    if(!site){site=blankSite(o.name,'');site.createdAt=new Date(base+i).toISOString();db.sites.push(site);}
    applyFields(site,o);
    if(!site.stage)site.stage='01';
    migrateSite(site);
    site.updatedAt=o.updatedAt||now();
    if(site.survey.lead)addTeamMember(site.survey.lead);
    queue(site.id,'save');i++;
  }
  db.sites.sort(byCreated);
}
function exportRows(){
  const f=['Project Name','Next Action','Total Score','Blocker | Concern | Risk','Survey History','Next Survey','Presentation','Proposal | Contract','Blueprint','EPC','Logistics','Warehouse','Construction','Province | City','Property Type','Site Owner | Landlord','Local Partner','Customer Needs','Site Size | Boundary','Parking Spaces','Transformer | Power','Distance | Cable Route','Meeting | Tariff','Competitor Survey','Key Survey Notes','Site Survey Files','Total Man Hours'];
  const feishu=[f,...db.sites.map(s=>FEISHU.map(([,p])=>{const v=getPath(s,p);return v==null?'':v;}))];
  const eh=['Project Name','EKONIX Owner','Stage (Aşama)','Status','Next Action Date','Last Updated','Son Durum (TR)','Engel (TR)','EVSE Capacity (kW)','PV & BESS Capacity','StarCharge Approval Date','CPO Partner'];
  const ekonix=[eh,...db.sites.map(s=>[s.name,s.survey.lead||'',stageLabel(s.stage),statusOf(s.status).en,s.nextActionDate||'',s.updatedAt?String(s.updatedAt).slice(0,10):'',s.statusTr||'',s.blockerTr||'',s.evseKw,s.pvbess||'',s.approvalDate||'',s.cpoPartner||''])];
  return {feishu,ekonix};
}

    <p class="note">.xlsx dosyasını seçin. Saha adı eşleşirse mevcut kayıt güncellenir, yoksa yeni kayıt açılır. Boş hücreler mevcut değeri silmez. “(Example)” satırları ve mükerrer adlar atlanır. Önce bir önizleme gösterilir, onaylamadan hiçbir şey kaydedilmez.</p>
    <div class="row-actions"><input type="file" id="impFile" accept=".xlsx,.xls,.csv"><span class="note" id="impMsg" role="status"></span></div>
    <div id="impPreview"></div></section>
  <section class="box"><h3>Feishu'ya ve Excel'e Aktar<small>${db.sites.length} lokasyon</small></h3>
    <p class="note">İndirilen dosyada iki sayfa vardır: <b>Feishu</b> (27 sütun, Feishu sırasıyla; Feishu tablosuna yapıştırılır) ve <b>EKONIX</b> (aşama, durum, sorumlu, tarihler). Aynı dosya tekrar içe aktarılabilir.</p>
    <div class="row-actions"><button type="button" class="primary" id="expXlsx">Excel Olarak İndir (.xlsx)</button><button type="button" id="expJson">Tam Yedek (JSON)</button></div></section>`;
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='impFile')return;
  const f=e.target.files[0];if(!f)return;
  const msg=$('impMsg');msg.textContent='Okunuyor…';$('impPreview').innerHTML='';
  try{

      <p class="note">Okunan sayfalar: ${esc(parsed.used.join(', '))}.${parsed.warns.length?' Uyarılar: '+esc(parsed.warns.slice(0,5).join('; '))+(parsed.warns.length>5?' …':''):''}</p>

      <div class="row-actions"><button type="button" class="primary" id="impGo">${plan.items.length} Saha İçe Aktar</button></div>`;

});
document.addEventListener('click',async e=>{
  const id=e.target.id;
  if(id==='impGo'){
    const {plan,parsed}=window._plan||{};if(!plan)return;
    e.target.disabled=true;await runImport(plan,parsed);window._plan=null;
    toast(plan.items.length+' saha aktarıldı ('+plan.add+' yeni, '+plan.upd+' güncelleme).');
    view='locations';F={q:'',stage:'',status:'',city:'',type:'',owner:'',partner:'',blocked:false};render();
  }else if(id==='expXlsx'){
    try{const XL=await loadXlsx(),{feishu,ekonix}=exportRows(),wb=XL.utils.book_new();
      XL.utils.book_append_sheet(wb,XL.utils.aoa_to_sheet(feishu),'Feishu');XL.utils.book_append_sheet(wb,XL.utils.aoa_to_sheet(ekonix),'EKONIX');

  }
});
