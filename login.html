<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/jpeg" href="/ekonix-logo.jpeg">
<link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plus-jakarta-sans-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<title>Giriş · Saha Değerlendirme Portalı</title>
<style>
/* Plus Jakarta Sans (SIL OFL, kendi sunucumuzdan; MKT Motors ile aynı yazı tipi). Türkçe karakterler latin-ext dosyasında. */
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/plus-jakarta-sans-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* EKONIX design-v1: lacivert zemin, çizgili belge kartı, tek marka mürekkebi */
:root{color-scheme:light;--navy:#0b2e57;--navy-d:#082244;--teal:#13a08a;--ink:#10202e;--muted:#5b6a7a;--hair:#dde4eb;--hair-strong:#c3ced9;--no:#a33327;--no-soft:#fbeae7;--side:#0a2440}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--side);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:100%;max-width:440px;background:#fff;border:1px solid var(--hair);border-radius:8px;padding:32px}
.card::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:3px solid var(--teal);border-left:3px solid var(--teal);border-top-left-radius:8px}
.logo{display:flex;justify-content:center;margin-bottom:8px}
.logo span{display:inline-flex;padding:4px 0}
.logo img{display:block;height:44px;width:auto}
h1{margin:14px 0 0;text-align:center;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.sub{margin:6px 0 0;text-align:center;font-size:13px;color:var(--muted)}
form{margin-top:24px;display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.field{position:relative}
.field>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
input{width:100%;height:44px;padding:0 14px 0 38px;border-radius:6px;border:1px solid var(--hair-strong);background:#fff;color:var(--ink);font:inherit;font-size:14px}
input::placeholder{color:#8a97a5}
input:focus{outline:2px solid var(--navy);outline-offset:0;border-color:var(--navy)}
input[type=password],input.pw{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.eye:hover{color:var(--ink);background:#edf1f5}
.eye:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.eye svg{width:16px;height:16px}
.eye .off{display:none}.eye.on .off{display:block}.eye.on .on-i{display:none}
.err{min-height:0;margin:0;padding:10px 12px;border-radius:0 6px 6px 0;border-left:3px solid var(--no);background:var(--no-soft);color:var(--ink);font-size:13px}
.err[hidden]{display:none}
button.go{width:100%;height:44px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s}
button.go:hover{background:var(--navy-d);border-color:var(--navy-d)}
button.go:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.go:disabled{opacity:.6;cursor:wait}
@media (max-width:420px){.card{padding:24px 20px}}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span><img src="/ekonix-logo.jpeg" alt="Ekonix Logo" width="289" height="93"></span></div>
  <h1>Saha Değerlendirme Portalı</h1>
  <p class="sub">Hesabınıza erişmek için e-posta ve şifrenizi girin.</p>
  <form id="f" novalidate>
    <div>
      <label for="email">E-posta</label>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="ad@firma.com" required autofocus>
      </div>
    </div>
    <div>
      <label for="password">Şifre</label>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" required>
        <button type="button" class="eye" id="eye" aria-label="Şifreyi göster" aria-pressed="false">
          <svg class="on-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
        </button>
      </div>
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="go" id="go" type="submit">Giriş yap</button>
  </form>
</main>
<script>
const $=id=>document.getElementById(id);
const err=m=>{$('err').textContent=m;$('err').hidden=!m;};
$('eye').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';
  $('eye').classList.toggle('on',show);$('eye').setAttribute('aria-pressed',String(show));$('eye').setAttribute('aria-label',show?'Şifreyi gizle':'Şifreyi göster');};
// Zaten oturum açıksa uygulamaya geç.
fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/');else if(r.status===503)err('Kimlik doğrulama henüz yapılandırılmamış. Yöneticinizle iletişime geçin.');}).catch(()=>{});
$('f').onsubmit=async e=>{
  e.preventDefault();err('');
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){err('E-posta ve şifre gerekli.');return;}
  $('go').disabled=true;$('go').textContent='Giriş yapılıyor…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.replace('/');return;}
    err(d.error||'Giriş yapılamadı. Lütfen tekrar deneyin.');
  }catch(x){err('Sunucuya ulaşılamadı. Bağlantınızı kontrol edin.');}
  $('go').disabled=false;$('go').textContent='Giriş yap';$('password').select();
};
</script>
</body>
</html>
