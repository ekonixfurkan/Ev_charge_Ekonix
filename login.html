<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Giriş · Saha Değerlendirme Portalı</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#020617;color:#f1f5f9;font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:448px;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
.logo{display:flex;justify-content:center;margin-bottom:8px}
.logo span{display:inline-flex;padding:8px 14px;background:#fff;border-radius:10px}
.logo img{display:block;height:40px;width:auto}
h1{margin:16px 0 0;text-align:center;font-size:20px;font-weight:700;color:#fff}
.sub{margin:6px 0 0;text-align:center;font-size:12px;color:#94a3b8}
form{margin-top:24px;display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:12px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
.field{position:relative}
.field>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#64748b;pointer-events:none}
input{width:100%;height:44px;padding:0 14px 0 38px;border-radius:8px;border:1px solid #1e293b;background:#020617;color:#f1f5f9;font:inherit;font-size:14px}
input::placeholder{color:#64748b}
input:focus{outline:0;border-color:#7cb52b;box-shadow:0 0 0 2px rgba(124,181,43,.4)}
input[type=password],input.pw{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:#94a3b8;cursor:pointer;padding:0}
.eye:hover{color:#fff;background:#1e293b}
.eye:focus-visible{outline:2px solid #7cb52b;outline-offset:1px}
.eye svg{width:16px;height:16px}
.eye .off{display:none}.eye.on .off{display:block}.eye.on .on-i{display:none}
.err{min-height:0;margin:0;padding:10px 12px;border-radius:8px;border:1px solid rgba(244,63,94,.3);background:rgba(76,5,25,.35);color:#fda4af;font-size:13px}
.err[hidden]{display:none}
button.go{width:100%;height:44px;border:0;border-radius:8px;background:#7cb52b;color:#020617;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 10px 15px -3px rgba(124,181,43,.1);transition:background .15s}
button.go:hover{background:#6ba022}
button.go:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.go:disabled{opacity:.6;cursor:wait}
@media (max-width:420px){.card{padding:24px 20px}}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span><img src="/ekore-logo.jpg" alt="Ekore Logo" width="738" height="210"></span></div>
  <h1>Saha Değerlendirme Portalı</h1>
  <p class="sub">Hesabınıza erişmek için e-posta ve şifrenizi girin.</p>
  <form id="f" novalidate>
    <div>
      <label for="email">E-posta</label>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="ad@firma.com" required autofocus>
      </div>
    </div>
    <div>
      <label for="password">Şifre</label>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" required>
        <button type="button" class="eye" id="eye" aria-label="Şifreyi göster" aria-pressed="false">
          <svg class="on-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
        </button>
      </div>
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="go" id="go" type="submit">Giriş yap</button>
  </form>
</main>
<script>
const $=id=>document.getElementById(id);
const err=m=>{$('err').textContent=m;$('err').hidden=!m;};
$('eye').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';
  $('eye').classList.toggle('on',show);$('eye').setAttribute('aria-pressed',String(show));$('eye').setAttribute('aria-label',show?'Şifreyi gizle':'Şifreyi göster');};
// Zaten oturum açıksa uygulamaya geç.
fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/');else if(r.status===503)err('Kimlik doğrulama henüz yapılandırılmamış. Yöneticinizle iletişime geçin.');}).catch(()=>{});
$('f').onsubmit=async e=>{
  e.preventDefault();err('');
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){err('E-posta ve şifre gerekli.');return;}
  $('go').disabled=true;$('go').textContent='Giriş yapılıyor…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.replace('/');return;}
    err(d.error||'Giriş yapılamadı. Lütfen tekrar deneyin.');
  }catch(x){err('Sunucuya ulaşılamadı. Bağlantınızı kontrol edin.');}
  $('go').disabled=false;$('go').textContent='Giriş yap';$('password').select();
};
</script>
</body>
</html>
